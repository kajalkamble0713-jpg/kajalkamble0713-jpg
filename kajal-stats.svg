<svg width="480" height="185" viewBox="0 0 480 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="479" height="184" rx="14" fill="url(#statBg)" stroke="#1e3a5f" stroke-width="1.4"/>

  <text x="24" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Kajal's GitHub Stats</text>

  <!-- rank ring -->
  <g transform="translate(80,112)">
    <circle r="52" fill="none" stroke="#0e2337" stroke-width="10"/>
    <circle r="52" fill="none" stroke="url(#ringStroke)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="326.7;70" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </circle>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#67e8f9" opacity="0">
      A+
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" opacity="0">
      RANK
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.6s" fill="freeze"/>
    </text>
  </g>

  <!-- stat rows -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5">
    <g transform="translate(0,0)">
      <text x="170" y="58" fill="#94a3b8" opacity="0">⭐ Total Stars Earned<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/></text>
      <text x="440" y="58" fill="#67e8f9" text-anchor="end" font-weight="bold" opacity="0">44<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/></text>
      <rect x="170" y="64" width="270" height="4" rx="2" fill="#0e2337"/>
      <rect x="170" y="64" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;190" dur="1s" begin="0.5s" fill="freeze"/></rect>
    </g>
    <g transform="translate(0,32)">
      <text x="170" y="58" fill="#94a3b8" opacity="0">📦 Total Commits<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/></text>
      <text x="440" y="58" fill="#93c5fd" text-anchor="end" font-weight="bold" opacity="0">612<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/></text>
      <rect x="170" y="64" width="270" height="4" rx="2" fill="#0e2337"/>
      <rect x="170" y="64" width="0" height="4" rx="2" fill="#3b82f6"><animate attributeName="width" values="0;230" dur="1s" begin="0.8s" fill="freeze"/></rect>
    </g>
    <g transform="translate(0,64)">
      <text x="170" y="58" fill="#94a3b8" opacity="0">🔀 Total PRs<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/></text>
      <text x="440" y="58" fill="#a5b4fc" text-anchor="end" font-weight="bold" opacity="0">28<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/></text>
      <rect x="170" y="64" width="270" height="4" rx="2" fill="#0e2337"/>
      <rect x="170" y="64" width="0" height="4" rx="2" fill="#818cf8"><animate attributeName="width" values="0;120" dur="1s" begin="1.1s" fill="freeze"/></rect>
    </g>
    <g transform="translate(0,96)">
      <text x="170" y="58" fill="#94a3b8" opacity="0">📁 Public Repos<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/></text>
      <text x="440" y="58" fill="#67e8f9" text-anchor="end" font-weight="bold" opacity="0">19<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/></text>
      <rect x="170" y="64" width="270" height="4" rx="2" fill="#0e2337"/>
      <rect x="170" y="64" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;150" dur="1s" begin="1.4s" fill="freeze"/></rect>
    </g>
  </g>
</svg>
