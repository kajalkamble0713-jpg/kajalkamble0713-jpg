<svg width="920" height="180" viewBox="0 0 920 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="shineT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="trophyClip"><rect x="0" y="0" width="920" height="180" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#trophyClip)">
    <rect width="920" height="180" fill="url(#trophyBg)"/>

    <!-- 5 trophy cells -->
    <g font-family="'Segoe UI', Arial, sans-serif">
      <!-- cell template repeated -->
      <g transform="translate(20,10)">
        <rect width="168" height="160" rx="12" fill="#0e1730" stroke="#1e3a5f" stroke-width="1.2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
        </rect>
        <g transform="translate(84,20) scale(0)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.15;1" keyTimes="0;0.7;1" dur="0.6s" begin="0.2s" fill="freeze"/>
          <path d="M-16 0 h32 v18 a16 16 0 0 1 -32 0 z" fill="#facc15"/>
          <rect x="-4" y="18" width="8" height="10" fill="#eab308"/>
          <rect x="-14" y="28" width="28" height="6" rx="2" fill="#eab308"/>
          <path d="M-16 4 q-14 0 -14 14 q0 10 12 12" fill="none" stroke="#facc15" stroke-width="3"/>
          <path d="M16 4 q14 0 14 14 q0 10 -12 12" fill="none" stroke="#facc15" stroke-width="3"/>
        </g>
        <text x="84" y="90" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600" opacity="0">Stargazer
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
        </text>
        <text x="84" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#facc15" opacity="0">A+
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
        </text>
        <text x="84" y="132" text-anchor="middle" font-size="10" fill="#64748b" opacity="0">RANK
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
        </text>
      </g>

      <g transform="translate(198,10)">
        <rect width="168" height="160" rx="12" fill="#0e1730" stroke="#1e3a5f" stroke-width="1.2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
        </rect>
        <g transform="translate(84,20) scale(0)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.15;1" keyTimes="0;0.7;1" dur="0.6s" begin="0.4s" fill="freeze"/>
          <path d="M-16 0 h32 v18 a16 16 0 0 1 -32 0 z" fill="#22d3ee"/>
          <rect x="-4" y="18" width="8" height="10" fill="#0891b2"/>
          <rect x="-14" y="28" width="28" height="6" rx="2" fill="#0891b2"/>
          <path d="M-16 4 q-14 0 -14 14 q0 10 12 12" fill="none" stroke="#22d3ee" stroke-width="3"/>
          <path d="M16 4 q14 0 14 14 q0 10 -12 12" fill="none" stroke="#22d3ee" stroke-width="3"/>
        </g>
        <text x="84" y="90" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600" opacity="0">Pull Shark
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
        </text>
        <text x="84" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#22d3ee" opacity="0">A
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
        </text>
        <text x="84" y="132" text-anchor="middle" font-size="10" fill="#64748b" opacity="0">RANK
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
        </text>
      </g>

      <g transform="translate(376,10)">
        <rect width="168" height="160" rx="12" fill="#0e1730" stroke="#1e3a5f" stroke-width="1.2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
        </rect>
        <g transform="translate(84,20) scale(0)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.15;1" keyTimes="0;0.7;1" dur="0.6s" begin="0.6s" fill="freeze"/>
          <path d="M-16 0 h32 v18 a16 16 0 0 1 -32 0 z" fill="#818cf8"/>
          <rect x="-4" y="18" width="8" height="10" fill="#6366f1"/>
          <rect x="-14" y="28" width="28" height="6" rx="2" fill="#6366f1"/>
          <path d="M-16 4 q-14 0 -14 14 q0 10 12 12" fill="none" stroke="#818cf8" stroke-width="3"/>
          <path d="M16 4 q14 0 14 14 q0 10 -12 12" fill="none" stroke="#818cf8" stroke-width="3"/>
        </g>
        <text x="84" y="90" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600" opacity="0">Quickdraw
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
        </text>
        <text x="84" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#818cf8" opacity="0">A+
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
        </text>
        <text x="84" y="132" text-anchor="middle" font-size="10" fill="#64748b" opacity="0">RANK
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
        </text>
      </g>

      <g transform="translate(554,10)">
        <rect width="168" height="160" rx="12" fill="#0e1730" stroke="#1e3a5f" stroke-width="1.2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
        </rect>
        <g transform="translate(84,20) scale(0)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.15;1" keyTimes="0;0.7;1" dur="0.6s" begin="0.8s" fill="freeze"/>
          <path d="M-16 0 h32 v18 a16 16 0 0 1 -32 0 z" fill="#67e8f9"/>
          <rect x="-4" y="18" width="8" height="10" fill="#22d3ee"/>
          <rect x="-14" y="28" width="28" height="6" rx="2" fill="#22d3ee"/>
          <path d="M-16 4 q-14 0 -14 14 q0 10 12 12" fill="none" stroke="#67e8f9" stroke-width="3"/>
          <path d="M16 4 q14 0 14 14 q0 10 -12 12" fill="none" stroke="#67e8f9" stroke-width="3"/>
        </g>
        <text x="84" y="90" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600" opacity="0">YOLO
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
        </text>
        <text x="84" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#67e8f9" opacity="0">B+
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
        </text>
        <text x="84" y="132" text-anchor="middle" font-size="10" fill="#64748b" opacity="0">RANK
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
        </text>
      </g>

      <g transform="translate(732,10)">
        <rect width="168" height="160" rx="12" fill="#0e1730" stroke="#1e3a5f" stroke-width="1.2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
        </rect>
        <g transform="translate(84,20) scale(0)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.15;1" keyTimes="0;0.7;1" dur="0.6s" begin="1.0s" fill="freeze"/>
          <path d="M-16 0 h32 v18 a16 16 0 0 1 -32 0 z" fill="#3b82f6"/>
          <rect x="-4" y="18" width="8" height="10" fill="#2563eb"/>
          <rect x="-14" y="28" width="28" height="6" rx="2" fill="#2563eb"/>
          <path d="M-16 4 q-14 0 -14 14 q0 10 12 12" fill="none" stroke="#3b82f6" stroke-width="3"/>
          <path d="M16 4 q14 0 14 14 q0 10 -12 12" fill="none" stroke="#3b82f6" stroke-width="3"/>
        </g>
        <text x="84" y="90" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600" opacity="0">Public Speaker
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
        </text>
        <text x="84" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#3b82f6" opacity="0">A
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
        </text>
        <text x="84" y="132" text-anchor="middle" font-size="10" fill="#64748b" opacity="0">RANK
          <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
        </text>
      </g>
    </g>

    <!-- shine sweep across whole card -->
    <rect x="-100" y="0" width="100" height="180" fill="url(#shineT)" transform="skewX(-20)">
      <animate attributeName="x" values="-100;1020" dur="3.5s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
