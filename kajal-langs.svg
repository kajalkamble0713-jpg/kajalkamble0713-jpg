<svg width="380" height="185" viewBox="0 0 380 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0d1730"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="379" height="184" rx="14" fill="url(#langBg)" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="24" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Most Used Languages</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13">
    <!-- JavaScript -->
    <g transform="translate(0,40)">
      <text x="24" y="14" fill="#facc15">● JavaScript</text>
      <text x="356" y="14" fill="#94a3b8" text-anchor="end">34%</text>
      <rect x="24" y="20" width="332" height="8" rx="4" fill="#0e2337"/>
      <rect x="24" y="20" width="0" height="8" rx="4" fill="#facc15">
        <animate attributeName="width" values="0;113" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </g>
    <!-- Python -->
    <g transform="translate(0,68)">
      <text x="24" y="14" fill="#22d3ee">● Python</text>
      <text x="356" y="14" fill="#94a3b8" text-anchor="end">26%</text>
      <rect x="24" y="20" width="332" height="8" rx="4" fill="#0e2337"/>
      <rect x="24" y="20" width="0" height="8" rx="4" fill="#22d3ee">
        <animate attributeName="width" values="0;86" dur="1.1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </g>
    <!-- HTML/CSS -->
    <g transform="translate(0,96)">
      <text x="24" y="14" fill="#3b82f6">● HTML / CSS</text>
      <text x="356" y="14" fill="#94a3b8" text-anchor="end">18%</text>
      <rect x="24" y="20" width="332" height="8" rx="4" fill="#0e2337"/>
      <rect x="24" y="20" width="0" height="8" rx="4" fill="#3b82f6">
        <animate attributeName="width" values="0;60" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </g>
    <!-- Java -->
    <g transform="translate(0,124)">
      <text x="24" y="14" fill="#818cf8">● Java</text>
      <text x="356" y="14" fill="#94a3b8" text-anchor="end">13%</text>
      <rect x="24" y="20" width="332" height="8" rx="4" fill="#0e2337"/>
      <rect x="24" y="20" width="0" height="8" rx="4" fill="#818cf8">
        <animate attributeName="width" values="0;43" dur="1.1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </g>
    <!-- SQL -->
    <g transform="translate(0,152)">
      <text x="24" y="14" fill="#67e8f9">● SQL</text>
      <text x="356" y="14" fill="#94a3b8" text-anchor="end">9%</text>
      <rect x="24" y="20" width="332" height="8" rx="4" fill="#0e2337"/>
      <rect x="24" y="20" width="0" height="8" rx="4" fill="#67e8f9">
        <animate attributeName="width" values="0;30" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </g>
  </g>
</svg>
